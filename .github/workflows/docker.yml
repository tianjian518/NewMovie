name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/newmovie:latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"   # 去掉前缀 v，得到 1.1.0（与手动推送的 1.0.0 约定一致）
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/newmovie:${VERSION}"
          fi
          # :full 是含 FFmpeg 完整镜像的别名（与 :latest 同一镜像）；
          # 历史文档/用户心智里提到的「:full 镜像」即此，确保引用仍可用。
          TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/newmovie:full"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
