name: Build and Push Multi-arch Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 用于推送到 ghcr.io（GITHUB_TOKEN 自动提供）
    # 把密钥映射成 env：secrets 上下文不能用于 if 条件（GitHub 服务端解析限制），
    # 因此条件判断改用 env，避免 dispatch 时报 "Unrecognized named-value: 'secrets'"。
    env:
      DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Docker Hub（主目标）：需要仓库 Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN ----
      # 仅在 secret 存在时登录与推送，缺 secret 也不会让整个 job 失败。
      - name: Login to Docker Hub
        if: ${{ env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- ghcr.io（兜底目标）：用 GITHUB_TOKEN，无需任何手动 secret ----
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          # Docker Hub
          DH=""
          if [[ -n "${DH_TOKEN}" ]]; then
            DH="${DH_USERNAME}/newmovie:latest"
            DH="${DH},${DH_USERNAME}/newmovie:2.0"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              DH="${DH},${DH_USERNAME}/newmovie:${VERSION}"
            fi
            DH="${DH},${DH_USERNAME}/newmovie:full"
          fi
          # ghcr.io（始终推送，保证多架构镜像一定能出去）；仓库名必须小写
          GH="ghcr.io/tianjian518/newmovie:latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            GH="${GH},ghcr.io/tianjian518/newmovie:${VERSION}"
          fi
          GH="${GH},ghcr.io/tianjian518/newmovie:2.0"
          # 合并
          TAGS="${DH}"
          if [[ -n "$TAGS" ]]; then TAGS="${TAGS},${GH}"; else TAGS="${GH}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
