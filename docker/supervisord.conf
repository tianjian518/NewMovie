; NewMovie 2.0 —— 同容器双进程编排。
;
; openlist(139cas) 监听 127.0.0.1:5244，只对容器内可见；
; newmovie 监听 0.0.0.0:8096，是用户唯一入口，并把 /openlist/* 反代到前者。
;
; 两个进程任一异常退出都自动拉起；日志统一输出到容器 stdout/stderr，
; 这样 `docker logs` 能一次看到全部，不用进容器翻文件。

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[program:openlist]
command=/app/openlist/openlist server --no-prefix --data /data/openlist
directory=/app/openlist
autostart=true
autorestart=true
startsecs=3
startretries=10
; 先起后端：NewMovie 的接管逻辑自带就绪轮询，早几秒晚几秒都不影响，
; 但先起能让首次启动少等一轮。
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=OPENLIST_HTTP_PORT="5244",OPENLIST_HTTPS_PORT="-1",UMASK="022"

[program:newmovie]
command=/app/newmovie
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:quit_on_fail]
; 任一进程进入 FATAL（重试耗尽仍起不来）时结束整个容器，
; 让编排层的 restart 策略接管。否则容器"活着但半残"，比直接挂掉更难排查。
command=/app/docker/quit-on-fail.sh
events=PROCESS_STATE_FATAL
